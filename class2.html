<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
      border: 3px solid black;
      border-collapse: collapse;
    }
    th, td {
  padding: 15px;
    }
    </style>
    
</head>
<body>
    <!-- Continuation of tables // about colspan and rowspan -->
     <!-- example of a colspan -->
      <table>
        <tr>
            <th colspan="2">Name </th>
            <th>Salary</th>
        </tr>
        <tr>
            <td rowspan="2">Joseph</td>
            <td>Mbugua</td>
            <td>32000</td>
        
        </tr>
        <tr>
            <td>Mary</td>
            <td>Molvine</td>
            <td>50000</td>
        </tr>
        <tr>
            <td>Ann</td>
            <td>Musyoka</td>
            <td>45000</td>
        </tr>
      </table>
</body>
</html>
