<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>customize vertical nav</title>
    <style>
        .nav{
            list-style-type: none;
        }
        .nav li{
            margin: 0;
            border:0;
            padding:0;
            background-color:rgb(15, 243, 243);
        }
        .nav li a{
            text-decoration: none;
            padding: 12px 10px;
            display: block;
        }
        .nav li a:hover{
            background-color:rgb(147, 195, 236);
            color:black;
        }


    </style>
</head>
<body>
    <ul class="nav">
        <li><a href="forms.html">Home</a></li>
        <li><a href="">About</a></li>
        <li><a href="">Testimonials</a></li>
        <li><a href="">Contacts</a></li>
    </ul>
</body>
</html>
